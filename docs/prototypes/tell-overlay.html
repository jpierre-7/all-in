<title>Tell Overlay Prototype</title>
<!--
  PROTOTYPE — throwaway. Answers #102 "Design the Tell overlay".
  Three variants of the explain-on-point panel on a mock of the combat table,
  at a true 640x360 canvas (see #92), integer-scaled. Switch with the bar or V.
  Not the game: the table logic here is just enough for Streak and All In to
  resolve so the "live numbers" question can be judged.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root {
    --page: #e9e4d6; --page-ink: #23201b; --page-dim: #6d675b; --page-rule: #c9c2b0;
    --bar: #1b1815; --bar-ink: #f1ebdc;
    /* the table itself is one look in every theme */
    --felt: #0c1a13; --felt-2: #10241a; --ink: #e6dfcc; --gold: #d9b35a; --neon: #e0334f;
    --dim: #8c877a; --card: #08120d; --hover: #ffe9a8; --burn: #ff8a94; --panel: #05100a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #16130f; --page-ink: #ece5d3; --page-dim: #9a927f; --page-rule: #3a342b; --bar: #ece5d3; --bar-ink: #16130f; }
  }
  :root[data-theme="dark"] { --page: #16130f; --page-ink: #ece5d3; --page-dim: #9a927f; --page-rule: #3a342b; --bar: #ece5d3; --bar-ink: #16130f; }

  body { background: var(--page); color: var(--page-ink); font: 15px/1.5 system-ui, sans-serif; padding: 16px 16px 96px; }
  .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h1 small { color: var(--page-dim); font-weight: 400; margin-left: 8px; }
  .stage { display: flex; justify-content: center; overflow: auto; }
  .frame { position: relative; flex: none; }
  .canvas {
    position: absolute; left: 0; top: 0; width: 640px; height: 360px; overflow: hidden;
    transform-origin: 0 0; background: var(--felt); color: var(--ink);
    font-family: 'VT323', 'Courier New', monospace; font-size: 18px; line-height: 1;
    image-rendering: pixelated; user-select: none;
    background-image: radial-gradient(ellipse at 50% 60%, var(--felt-2) 0%, var(--felt) 70%);
  }
  .canvas * { box-sizing: border-box; }
  .abs { position: absolute; }
  .gold { color: var(--gold); } .neon { color: var(--neon); } .dim { color: var(--dim); } .ink { color: var(--ink); }
  .big { font-size: 34px; } .mid { font-size: 22px; } .sm { font-size: 16px; }
  .term { cursor: help; border-bottom: 1px dotted var(--dim); }
  .term.on { color: var(--hover); border-bottom-color: var(--hover); }

  /* the Draw */
  .draw { position: absolute; left: 0; top: 232px; width: 640px; display: flex; justify-content: center; gap: 6px; }
  .slot { width: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .card {
    width: 56px; height: 80px; background: var(--card); border: 2px solid var(--gold);
    position: relative; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; padding: 3px 4px;
  }
  .card.on { border-color: var(--hover); box-shadow: 0 0 0 1px var(--hover) inset; }
  .card.burn { border-color: var(--burn); }
  .card.awaiting { border-color: var(--neon); }
  .card .v { font-size: 16px; color: var(--gold); }
  .card .v.br { align-self: flex-end; }
  .card .ic { position: absolute; left: 14px; top: 26px; width: 28px; height: 28px; image-rendering: pixelated; }
  .key { font-size: 16px; color: var(--dim); }
  .key.on { color: var(--hover); }
  .ghost { width: 56px; height: 80px; border: 2px dashed #24362c; }

  /* A: the Rail */
  .rail { left: 448px; top: 48px; width: 180px; height: 168px; background: var(--panel); border: 2px solid var(--gold); padding: 6px 7px; display: flex; flex-direction: column; gap: 5px; }
  .rail .head { display: flex; justify-content: space-between; align-items: baseline; }
  .rail .rule { font-size: 16px; line-height: 1.05; }
  .rail .now { border-top: 1px solid #2c4335; padding-top: 4px; font-size: 16px; line-height: 1.05; }
  .rail .foot { margin-top: auto; font-size: 16px; line-height: 1.05; color: var(--dim); }
  .rail .foot b { color: var(--dim); font-weight: normal; border-bottom: 1px dotted var(--dim); }

  /* B: the Tag */
  .tag { width: 168px; background: var(--panel); border: 2px solid var(--gold); padding: 5px 6px; font-size: 16px; line-height: 1.05; display: flex; flex-direction: column; gap: 3px; }
  .tag:after { content: ''; position: absolute; left: var(--ax, 50%); bottom: -8px; width: 0; height: 0; border: 6px solid transparent; border-top-color: var(--gold); border-bottom: 0; margin-left: -6px; }
  .tag .name { color: var(--gold); font-size: 18px; }
  .tag.nest { border-color: var(--dim); width: 150px; z-index: 2; }
  .tag.nest:after { display: none; }
  .tag.nest .name { color: var(--ink); font-size: 16px; }

  /* C: the Dealer */
  .lift { left: 40px; top: 44px; width: 112px; height: 160px; background: var(--card); border: 2px solid var(--hover); padding: 6px 7px; display: flex; flex-direction: column; gap: 4px; }
  .lift .v { font-size: 22px; color: var(--gold); display: flex; justify-content: space-between; }
  .lift .nm { font-size: 18px; color: var(--ink); line-height: 1; }
  .lift .rl { font-size: 16px; line-height: 1.05; color: var(--ink); margin-top: auto; }
  .lift .ic { width: 28px; height: 28px; image-rendering: pixelated; align-self: center; }
  .patter { left: 168px; top: 150px; width: 300px; font-size: 18px; line-height: 1.1; color: var(--ink); }
  .patter:before { content: '“'; color: var(--neon); } .patter:after { content: '”'; color: var(--neon); }
  .patter.idle { color: var(--dim); font-size: 16px; } .patter.idle:before, .patter.idle:after { content: ''; }

  /* switcher: obviously not part of the design */
  .bar {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bar); color: var(--bar-ink); border-radius: 999px 999px 0 0; display: flex; align-items: center; gap: 12px;
    font: 14px/1 system-ui, sans-serif; box-shadow: 0 -2px 12px rgba(0,0,0,.25); white-space: nowrap;
  }
  .bar button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font-size: 16px; }
  .bar button:focus-visible { outline: 2px solid var(--gold); }
  .bar .lbl { min-width: 150px; text-align: center; }
  .bar select { background: none; color: inherit; border: 1px solid currentColor; border-radius: 6px; padding: 4px 6px; font: inherit; }

  .brief { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 22px; border-top: 1px solid var(--page-rule); padding-top: 14px; }
  .brief h2 { font-size: 14px; margin: 0 0 6px; }
  .brief h2.cur { color: var(--neon); }
  .brief p { margin: 0; color: var(--page-dim); font-size: 14px; }
  .keys { color: var(--page-dim); font-size: 14px; }
  kbd { font: 12px/1 ui-monospace, monospace; border: 1px solid var(--page-rule); border-radius: 4px; padding: 2px 5px; }
</style>

<div class="wrap">
  <h1>Tell overlay <small>three takes on the table, 640×360, for #102</small></h1>
  <div class="stage"><div class="frame" id="frame"><div class="canvas" id="canvas"></div></div></div>
  <div class="keys">
    <kbd>←</kbd> <kbd>→</kbd> walk the Draw &nbsp; <kbd>1</kbd>–<kbd>7</kbd> play (or pick the card to burn) &nbsp; <kbd>Enter</kbd> show the Hand, next turn &nbsp; <kbd>Esc</kbd> let go &nbsp; <kbd>V</kbd> next variant &nbsp; — or just hover.
  </div>
  <div class="brief" id="brief"></div>
</div>

<div class="bar" role="toolbar" aria-label="Prototype variant">
  <button id="prev" aria-label="Previous variant">‹</button>
  <span class="lbl" id="lbl"></span>
  <button id="next" aria-label="Next variant">›</button>
  <select id="zoom" aria-label="Zoom"><option value="0">fit</option><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select>
</div>

// ---- a mock of the table ---------------------------------------------------
const DECK = [
  { name: 'Hot Streak', stack: 3, tell: 'Streak' },
  { name: 'Pawned Ring', stack: 8 },
  { name: 'Car Keys', stack: 3, tell: 'AllIn' },
  { name: 'Four of Hearts', stack: 4 },
  { name: 'Dealer Blinks', stack: 5, tell: 'Streak' },
  { name: 'Firstborn', stack: 5, tell: 'AllIn' },
  { name: 'Six of Diamonds', stack: 6 },
  { name: 'Bus Ticket Home', stack: 4 },
  { name: 'Lucky Seat', stack: 4, tell: 'Streak' },
  { name: 'Last Dollar', stack: 2, tell: 'AllIn' },
  { name: 'Marked Card', stack: 7 },
];
const S = { draw: [], played: [], hand: 0, plays: 5, edge: 24, turn: 1, awaiting: null, pointer: null, target: null, nest: null, last: null };

function deal() {
  const pool = DECK.slice();
  S.draw = [];
  // first turn is the fixed set above so the variants are comparable; later turns shuffle.
  if (S.turn === 1) S.draw = pool.slice(0, 7);
  else { for (let i = 0; i < 7; i++) S.draw.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]); }
  S.played = []; S.hand = 0; S.plays = 5; S.awaiting = null; S.pointer = null; S.target = null; S.nest = null;
}
const lastHadTell = () => S.played.length > 0 && !!S.played[S.played.length - 1].tell;
/** What card i is worth if played right now, and why. */
function now(i) {
  const c = S.draw[i];
  if (!c) return null;
  if (S.awaiting !== null && S.awaiting !== i) {
    const a = S.draw[S.awaiting];
    return { n: a.stack + c.stack, why: `Burn it: ${a.name} plays for ${a.stack} + ${c.stack}.` };
  }
  if (c.tell === 'Streak') return lastHadTell()
    ? { n: c.stack * 2, why: `${S.played[S.played.length - 1].name} had a Tell, so this doubles.` }
    : { n: c.stack, why: S.played.length ? `${S.played[S.played.length - 1].name} had no Tell. Play a Tell first to double it.` : 'Nothing played yet, so no double. Play a Tell first.' };
  if (c.tell === 'AllIn') {
    const best = S.draw.filter((_, j) => j !== i).reduce((m, d) => Math.max(m, d.stack), 0);
    return { n: c.stack + best, why: `${c.stack} plus the card you burn: up to ${best} right now.` };
  }
  return { n: c.stack, why: 'No Tell. What it says.' };
}
function play(i) {
  const c = S.draw[i]; if (!c || S.plays === 0) return;
  if (S.awaiting !== null) {
    if (i === S.awaiting) { S.awaiting = null; render(); return; }
    const a = S.draw[S.awaiting];
    S.hand += a.stack + c.stack; S.plays--;
    S.played.push(a); S.last = `${a.name} burns ${c.name}: +${a.stack + c.stack}.`;
    S.draw = S.draw.filter((_, j) => j !== i && j !== S.awaiting); S.awaiting = null;
  } else if (c.tell === 'AllIn') {
    if (S.draw.length < 2) return;
    S.awaiting = i; S.last = `${c.name}: pick the card to burn.`;
  } else {
    const v = now(i); S.hand += v.n; S.plays--; S.played.push(c);
    S.last = `${c.name}: +${v.n}.`; S.draw.splice(i, 1);
  }
  if (S.pointer !== null && S.pointer >= S.draw.length) S.pointer = S.draw.length ? S.draw.length - 1 : null;
  S.target = S.pointer !== null ? { kind: 'card', i: S.pointer } : null; S.nest = null;
  render();
}
function showHand() {
  const diff = S.hand - S.edge;
  S.last = diff >= 0 ? `${S.hand} vs House Edge ${S.edge}: Payout ${diff}.` : `${S.hand} vs House Edge ${S.edge}: Whiff. You lose ${-diff}.`;
  S.turn++; if (S.turn % 3 === 1) S.edge += 2;
  deal(); render();
}

const VARIANTS = [

  { key: 'B', name: 'The Tag', blurb: 'Balatro\'s framing: a tag floats above the card you point at and says the Tell, nothing else. Terms inside the rule light up; point at one and a second tag opens beside it. Cards only; the rest of the table stays mute.' },
  { key: 'C', name: 'The Dealer', blurb: 'The pointed card lifts into a big face with its rule printed on it, and the dealer says a line about it. Whole read, in voice, no nesting. Point at the Edge or a Stack and the dealer speaks to that too.' },
];
let V = 0;
function variantFromUrl() {
  const q = new URLSearchParams(location.search).get('variant') || location.hash.replace('#', '');
  const i = VARIANTS.findIndex(v => v.key === (q || '').toUpperCase()); if (i >= 0) V = i;
}
function setVariant(i) {
  V = (i + VARIANTS.length) % VARIANTS.length;

}

function drawHtml() {

  const line = S.awaiting !== null && S.awaiting !== t.i ? `Burn ${c.name}? That makes it ${v.n}.` : (PATTER[c.name] || `${c.stack}.`);
  return `<div class="abs lift"><div class="v"><span>${c.stack}</span>${tl ? `<span class="sm gold">${tl.name}</span>` : ''}</div>
      <div class="nm">${h(c.name)}</div>${c.tell ? `<img class="ic" src="${ICON[c.tell]}" alt="">` : ''}
      <div class="rl">${tl ? h(plain(tl.rule)) : '<span class="dim">No Tell.</span>'}</div></div>
    <div class="abs patter">${h(line)}</div>`;
}

function render() {
  const v = VARIANTS[V];
  canvas.innerHTML = tableText(v) + drawHtml() + (v.key === 'A' ? overlayA() : v.key === 'B' ? overlayB() : overlayC());
  document.getElementById('lbl').textContent = `${v.key} · ${v.name}`;
  document.getElementById('brief').innerHTML = VARIANTS.map((x, i) => `<div><h2 class="${i === V ? 'cur' : ''}">${x.key} · ${x.name}</h2><p>${x.blurb}</p></div>`).join('');
  // mark the pointed term
  if (S.target && S.target.kind === 'term') canvas.querySelectorAll(`[data-term="${S.target.term}"]`).forEach(el => el.classList.add('on'));
}

// ---- input ------------------------------------------------------------------------
canvas.addEventListener('mouseover', (e) => {
  const card = e.target.closest('[data-card]');
  const term = e.target.closest('[data-term]');
  if (card) { S.target = { kind: 'card', i: +card.dataset.card }; S.nest = null; render(); }
  else if (term && term.closest('#tag')) { S.nest = term.dataset.term; render(); }
  else if (term) { S.target = { kind: 'term', term: term.dataset.term }; S.nest = null; render(); }
});
canvas.addEventListener('mouseleave', () => { S.target = S.pointer !== null ? { kind: 'card', i: S.pointer } : null; S.nest = null; render(); });
canvas.addEventListener('mouseout', (e) => {
  const term = e.target.closest('[data-term]');
  if (term && term.closest('#tag')) { S.nest = null; render(); }
});
canvas.addEventListener('click', (e) => { const card = e.target.closest('[data-card]'); if (card) play(+card.dataset.card); });

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key >= '1' && e.key <= '7') { play(+e.key - 1); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (!S.draw.length) return;
    const d = e.key === 'ArrowLeft' ? -1 : 1;
    S.pointer = S.pointer === null ? (d > 0 ? 0 : S.draw.length - 1) : (S.pointer + d + S.draw.length) % S.draw.length;
    S.target = { kind: 'card', i: S.pointer }; S.nest = null; render(); e.preventDefault(); return;
  }
  if (e.key === 'Enter') { showHand(); return; }
  if (e.key === 'Escape') { S.pointer = null; S.target = null; S.nest = null; S.awaiting = null; render(); return; }
  if (e.key === 'v' || e.key === 'V') { setVariant(V + 1); }
});
document.getElementById('prev').onclick = () => setVariant(V - 1);
document.getElementById('next').onclick = () => setVariant(V + 1);

// ---- scale --------------------------------------------------------------------------
const frame = document.getElementById('frame'), zoom = document.getElementById('zoom');
function fit() {
  let k = +zoom.value;
  if (!k) k = Math.max(1, Math.floor(Math.min((innerWidth - 32) / 640, (innerHeight - 220) / 360)));
  canvas.style.transform = `scale(${k})`;
  frame.style.width = 640 * k + 'px'; frame.style.height = 360 * k + 'px';
}
zoom.onchange = fit; addEventListener('resize', fit);

variantFromUrl(); deal(); render(); fit();
</script>
