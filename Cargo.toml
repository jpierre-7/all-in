[package]
name = "all-in"
version = "0.1.0"
edition = "2024"

[workspace]
# The balance sim (#94): plays the real Duel headless. `cargo run --release -p sim`.
members = ["tools/sim"]

[dependencies]
bevy = "0.19.1"
directories = "6.0.0"
ron = "0.12"
serde = { version = "1.0.229", features = ["derive"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
